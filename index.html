 S.forEach(t=>{if(g&&t.tanggal!=last){last=t.tanggal;const n=S.filter(x=>x.tanggal==last&&x.status=='Aktif'&&!/^Transfer/.test(x.jenis)).reduce((x,y)=>x+sg(y),0);h+=`<div class="dh"><span>${last==D.today?'Hari ini':pd(last).toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'short'})}</span><span>${n>=0?'+':'−'}${rp(Math.abs(n))}</span></div>`}h+=txRow(t)});
 return `<div class="g sg">${K('Transaksi',L.length)}${K('Masuk',rp(i),'gr')}${K('Keluar',rp(o),'rd')}</div>`+(L.length>200?'<p class="sm">Menampilkan 200 teratas, gunakan filter/ekspor.</p>':'')+(h||'<p class="sm">Tidak ada transaksi yang cocok.</p>')}

JJ.jajan=()=>{const w=rng('minggu'),rec=D.jaj.filter(j=>j.periode==w[0]&&j.status=='Diterima'),got=rec.reduce((s,j)=>s+j.nominal,0),out=sm(outv(w)),ang=+D.cfg.jajan,kb=sm(outv(w).filter(t=>t.tingkat=='Wajib'||t.tingkat=='Penting')),tb=act().filter(t=>t.jenis=='Transfer Masuk'&&t.sumber=='Tabungan'&&inr(t,w)).reduce((s,t)=>s+t.nominal,0);

function tgForm(id){const t=D.tgt.find(x=>x.id==id)||{};form(id?'Edit Target':'Target Baru',[{k:'nama',l:'Nama target',v:t.nama},{k:'target',l:'Nominal target (Rp)',t:'number',v:t.target},{k:'tenggat',l:'Tenggat (opsional)',t:'date',v:t.tenggat},{k:'prioritas',l:'Prioritas',t:'select',o:['Tinggi','Sedang','Rendah'],v:t.prioritas}],(v,b)=>{if(!v.nama.trim()||!num(v.target,'Target'))return;doit('tgSave',{id:id,nama:v.nama,target:v.target,tenggat:v.tenggat,prioritas:v.prioritas},b)})}

PG.tg=()=>{const L=D.tgt.filter(x=>x.status!='Nonaktif'),sv=D.bal.Tabungan||0,al=L.reduce((s,x)=>s+x.terkumpul,0),kuBelum=!cnt('Kuota Internet',rng('bulan')).length?+D.cfg.kuota:0,saran=Math.max(0,liquid()-kuBelum);
 return `<div class="bar"><h2>Target Tabungan</h2><div class="row nop" style="flex:none"><button class="b2" onclick="tfForm({ke:'Tabungan'})">Pindah ke Tabungan</button><button class="b" onclick="tgForm()">＋ Target</button></div></div><div class="g">${K('Saldo Tabungan aktual',rp(sv),'pu')}${K('Sudah dialokasikan',rp(al))}${K('Belum dialokasikan',rp(sv-al))}</div><div class="card"><b>Saran</b><p class="sm">Saldo di luar Tabungan setelah menyisihkan kuota yang belum dibayar: ${rp(saran)}. Menabung hanya jika kebutuhan penting sudah aman — tidak ada kewajiban.</p></div>
 ${L.map(x=>`<div class="card"><div class="bar" style="margin:0"><b>${esc(x.nama)} <span class="sm">${x.prioritas}${x.tenggat?' · '+x.tenggat:''}</span></b><div class="row" style="flex:none"><button class="b2" onclick="alokForm('${x.id}')">Alokasi</button><button class="b2" onclick="tgForm('${x.id}')">Edit</button><button class="b2" onclick="doit('tgDel',{id:'${x.id}'},this)">✕</button></div></div><p class="sm" style="margin:6px 0">${rp(x.terkumpul)} / ${rp(x.target)} · sisa ${rp(Math.max(0,x.target-x.terkumpul))} · ${Math.round(x.terkumpul/x.target*100)}%</p>${pbar(x.terkumpul/x.target)}${est(x)}</div>`).join('')||'<div class="card sm">Belum ada target.</div>'}`};

/* ---------- Analisis & simulasi ---------- */
PG.an=()=>`<div class="tabs">${[['analisis','Ringkasan'],['diagram','Diagram'],['bandingkan','Bandingkan'],['simulasi','Simulasi']].map(x=>`<button class="${T.an==x[0]?'on':''}" onclick="T.an='${x[0]}';render()">${x[1]}</button>`).join('')}</div>`+(T.an=='diagram'?diagram():T.an=='bandingkan'?bandingkan():T.an=='simulasi'?simul():analisis());
function trend(){const W=[];for(let i=7;i>=0;i--){const r=rng('minggu',-i);W.push([r[0].slice(5),sm(outv(r))])}const mx=Math.max(1,...W.map(x=>x[1])),bw=600/W.length;
 return `<div class="card"><b>Tren pengeluaran 8 minggu</b><svg viewBox="0 0 600 160" class="ch">${W.map((x,i)=>{const h=x[1]/mx*105;return `<rect x="${i*bw+bw*.15}" y="${125-h}" width="${bw*.7}" height="${h}" rx="6" fill="${i==7?'#2563eb':'#93b4f5'}"><title>${rp(x[1])}</title></rect><text x="${i*bw+bw/2}" y="${119-h}" text-anchor="middle" font-size="12">${x[1]?Math.round(x[1]/1000)+'k':''}</text><text x="${i*bw+bw/2}" y="150" text-anchor="middle" font-size="12">${x[0]}</text>`}).join('')}</svg></div>`}
function analisis(){if(act().length<5)return '<div class="card">Analisis membutuhkan lebih banyak catatan (minimal 5 transaksi aktif).</div>';
 const w=rng('minggu'),pw=rng('minggu',-1),m=rng('bulan'),pm=rng('bulan',-1),ow=sm(outv(w)),opw=sm(outv(pw)),om=sm(outv(m)),opm=sm(outv(pm)),im=sm(inc(m)),cat={};
 outv(m).forEach(x=>cat[x.kategori]=(cat[x.kategori]||0)+x.nominal*(x.jenis=='Pengembalian'?-1:1));const L=Object.entries(cat).sort((a,b)=>b[1]-a[1]).slice(0,6),mx=L[0]?Math.max(1,L[0][1]):1,tips=[];
 if(opw>0&&ow>opw*1.2)tips.push('Pengeluaran minggu ini lebih tinggi dari minggu lalu. Coba lihat kategori terbesarmu dan sesuaikan anggaran.');
 const fm=cnt('Futsal',m).length,fp=cnt('Futsal',pm).length;if(fp>0&&fm>fp)tips.push('Pengeluaran futsal bulan ini meningkat karena sesi lebih banyak. Coba periksa apakah anggaran hiburanmu masih sesuai.');
 if((+D.cfg.parkir_hari||0)>0&&cnt('Parkir',w).length>+D.cfg.parkir_hari)tips.push('Biaya parkir minggu ini lebih tinggi daripada rencana. Kamu bisa menyesuaikan estimasi berdasarkan hari parkir yang benar-benar terjadi.');
 if(cnt('Kuota Internet',m).length)tips.push('Kuota bulan ini sudah dibeli. Tidak perlu mengalokasikan pembelian yang sama sebagai pengeluaran aktual untuk kedua kalinya.');
 bud().filter(x=>x.p>1).forEach(x=>tips.push('Pengeluaran '+esc(x.kategori)+' ('+x.periode.toLowerCase()+') melewati anggaran '+rp(x.batas)+'.'));
 if(!tips.length)tips.push('Belum ada hal yang perlu diperhatikan. Terus catat transaksimu ya.');
 return `<div class="g">${K('Pengeluaran minggu ini',rp(ow),'rd')}${K('Minggu lalu',rp(opw))}${K('Pengeluaran bulan ini',rp(om),'rd')}${K('Bulan lalu',rp(opm))}${K('Pemasukan tersisa bulan ini',im>0?Math.round((im-om)/im*100)+'%':'-')}${K('Futsal bulan ini',fm+' sesi · '+rp(sm(cnt('Futsal',m))))}${K('Parkir bulan ini',rp(sm(cnt('Parkir',m))))}${K('Kuota bulan ini',rp(sm(cnt('Kuota Internet',m))))}</div>
 ${trend()}<div class="card"><b>Kategori terbesar bulan ini</b>${L.map(x=>`<p class="sm" style="margin:8px 0 2px">${esc(x[0])} · ${rp(x[1])}</p>${pbar(x[1]/mx)}`).join('')||'<p class="sm">Belum ada pengeluaran.</p>'}</div><div class="card"><b>Saran</b>${tips.map(x=>`<p>• ${x}</p>`).join('')}<p class="sm">Saran bersifat perkiraan dan tidak menjamin target tercapai.</p></div>`}
function simul(){setTimeout(sim,0);return `<div class="card"><b>Simulasi pengeluaran</b><p class="sm">Hanya perhitungan — tidak mengubah saldo atau spreadsheet.</p><label>Hari parkir<input id="s1" type="number" min="0" value="${+D.cfg.parkir_hari||0}" oninput="sim()"></label><label>Sesi futsal<input id="s2" type="number" min="0" value="0" oninput="sim()"></label><label>Beli kuota?<select id="s3" onchange="sim()"><option>Tidak</option><option>Ya</option></select></label><label>Pengeluaran lain / sparepart (Rp)<input id="s4" type="text" inputmode="numeric" data-m="1" autocomplete="off" value="0" oninput="sim()"></label><label>Tambahan dari kakak (Belum diterima, Rp)<input id="s5" type="text" inputmode="numeric" data-m="1" autocomplete="off" value="0" oninput="sim()"></label><div id="sr"></div></div>`}
function sim(){if(!$('sr'))return;const g=i=>+un($(i).value)||0,base=liquid(),out=g('s1')*(+D.cfg.parkir)+g('s2')*(+D.cfg.futsal)+($('s3').value=='Ya'?+D.cfg.kuota:0)+g('s4'),res=base-out;
 $('sr').innerHTML=`<div class="g">${K('Saldo aktual (tanpa Tabungan)',rp(base))}${K('Total rencana keluar',rp(out),'rd')}${K('Sisa uang',rp(res),res<0?'rd':'gr')}${K('Jika tambahan kakak diterima',rp(res+g('s5')))}</div>${res<0?'<p style="color:var(--r)">Saldo tidak cukup untuk rencana ini.</p>':''}`}

/* ---------- Diagram & perbandingan ---------- */
const GR={Semua:null,Jajan:['Jajan dan makanan','Minuman dan camilan'],Parkir:['Parkir'],Futsal:['Futsal'],Kuota:['Kuota Internet'],Motor:['Bensin','Sparepart motor','Servis motor']};
const SC=['#2563eb','#7c3aed','#0d9488','#f97316','#64748b'];
const card=(t,sb,b)=>`<div class="card"><div class="bar" style="margin-bottom:6px"><b>${t}</b><span class="sm">${sb||''}</span></div>${b}</div>`;
const seg=(o,c,key)=>`<div class="tabs">${o.map(x=>`<button class="${x[0]==c?'on':''}" onclick="setF('${key}','${x[0]}')">${x[1]}</button>`).join('')}</div>`;
const setF=(k,v)=>{F[k]=v;render()};
const sumCat=(r,cs)=>sm(outv(r).filter(t=>!cs||cs.indexOf(t.kategori)>=0));
function lineSvg(vals,labs,col){const n=vals.length,mx=Math.max(1,...vals),px=i=>n>1?20+i*560/(n-1):300,py=v=>125-Math.max(0,v)/mx*100,tx=(i)=>esc(labs[i]+': '+rp(vals[i]));
 return `<svg viewBox="0 0 600 160" class="ch" role="img" aria-label="Grafik garis"><polyline points="${vals.map((v,i)=>px(i)+','+py(v)).join(' ')}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round"/>${vals.map((v,i)=>`<circle cx="${px(i)}" cy="${py(v)}" r="${n>20?4:6}" fill="${col}" style="cursor:pointer" data-t="${tx(i)}" onclick="toast(this.dataset.t)"><title>${tx(i)}</title></circle>`).join('')}<text x="20" y="152" font-size="11">${esc(labs[0])}</text><text x="580" y="152" font-size="11" text-anchor="end">${esc(labs[n-1])}</text></svg><p class="sm">Dari ${rp(vals[0])} ke ${rp(vals[n-1])}. Ketuk titik untuk melihat nilai.</p>`}
function bars(mode){const B=[];
 if(mode=='Mingguan')for(let i=7;i>=0;i--){const r=rng('minggu',-i);B.push([r[0].slice(5),r])}
 else if(mode=='Bulanan')for(let i=5;i>=0;i--){const r=rng('bulan',-i);B.push([r[0].slice(0,7),r])}
 else for(let i=2;i>=0;i--){const r=rng('tahun',-i);B.push([r[0].slice(0,4),r])}
 const V=B.map(b=>[b[0],sm(inc(b[1])),sm(outv(b[1]))]);
 if(V.every(v=>!v[1]&&!v[2]))return empty('Belum ada pemasukan atau pengeluaran pada periode ini');
 const mx=Math.max(1,...V.map(v=>Math.max(v[1],v[2]))),bw=600/V.length,h=v=>Math.max(0,v)/mx*100,sh=v=>v?Math.round(v/1000)+'k':'';
 return `<svg viewBox="0 0 600 160" class="ch" role="img" aria-label="Diagram batang pemasukan dan pengeluaran">${V.map((v,i)=>{const a=esc(v[0]+' pemasukan '+rp(v[1])),b=esc(v[0]+' pengeluaran '+rp(v[2]));return `<rect x="${i*bw+bw*.1}" y="${125-h(v[1])}" width="${bw*.38}" height="${h(v[1])}" rx="4" fill="#16a34a" style="cursor:pointer" data-t="${a}" onclick="toast(this.dataset.t)"><title>${a}</title></rect><rect x="${i*bw+bw*.52}" y="${125-h(v[2])}" width="${bw*.38}" height="${h(v[2])}" rx="4" fill="#f43f5e" style="cursor:pointer" data-t="${b}" onclick="toast(this.dataset.t)"><title>${b}</title></rect><text x="${i*bw+bw*.29}" y="${120-h(v[1])}" text-anchor="middle" font-size="10">${sh(v[1])}</text><text x="${i*bw+bw*.71}" y="${120-h(v[2])}" text-anchor="middle" font-size="10">${sh(v[2])}</text><text x="${i*bw+bw/2}" y="150" text-anchor="middle" font-size="11">${v[0]}</text>`}).join('')}</svg><div class="lgd"><span><i style="background:#16a34a"></i>Pemasukan</span><span><i style="background:#f43f5e"></i>Pengeluaran</span></div><p class="sm">Total: masuk ${rp(V.reduce((a,v)=>a+v[1],0))}, keluar ${rp(V.reduce((a,v)=>a+v[2],0))}. Transfer internal tidak dihitung.</p>`}
function trendLine(){const g=F.tc||'Semua',m=F.tg||'Mingguan',L=[];
 if(m=='Harian')for(let i=13;i>=0;i--){const d=add(D.today,-i);L.push([d.slice(5),[d,d]])}else for(let i=7;i>=0;i--){const r=rng('minggu',-i);L.push([r[0].slice(5),r])}
 const v=L.map(x=>sumCat(x[1],GR[g]));
